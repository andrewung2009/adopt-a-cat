<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .dashboard { display: grid; gap: 24px; }
    .section { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 20px; }
    .section h2 { margin-top: 0; font-size: 1.2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; }
    th { background: #fdf8f4; font-weight: 600; color: #555; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-available { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-adopted { background: #e0e7ff; color: #3730a3; }
    .badge-fed { background: #dcfce7; color: #166534; }
    .badge-hungry { background: #fee2e2; color: #991b1b; }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; display: none; }
    .msg.success { background: #dcfce7; color: #166534; display: block; }
    .empty-row td { text-align: center; color: #888; padding: 20px; }
  </style>
</head>
<body>
  <header class="site">
    <a href="index.html" class="brand">&#128008; Adopt a Cat</a>
    <nav></nav>
  </header>

  <main>
    <h1>Admin Dashboard</h1>
    <p class="msg" id="msg"></p>

    <div class="dashboard">
      <div class="section">
        <h2>Adoption Inquiries</h2>
        <table id="inquiries-table">
          <thead>
            <tr>
              <th>Cat</th>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="inquiries-body"></tbody>
        </table>
        <div id="inquiries-pagination"></div>
      </div>

      <div class="section">
        <h2>All Cats</h2>
        <table id="cats-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Status</th>
              <th>Fed Status</th>
              <th>Last Fed</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cats-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
